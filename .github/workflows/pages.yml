name: Publish site (Pages)

# Publishes the storefront to GitHub Pages via a workflow (instead of plain
# branch serving) so the SEO/OG tags from the CMS can be baked into <head>
# before publish — for social crawlers that don't run JavaScript.
#
# REQUIRES a one-time settings change: Settings → Pages → Build and deployment
# → Source → "GitHub Actions". Until that is switched, this workflow's deploy
# step fails harmlessly and the existing branch-based Pages keeps serving.

# Manual-only for now. This deploys Pages via a workflow (with the SEO head
# bake), which requires Settings → Pages → Source → "GitHub Actions". Until that
# switch is made, running it just fails at deploy-pages — so it does NOT run on
# push (that only produced a harmless red ✗). When you're ready for the social
# SEO bake: flip the Pages source to "GitHub Actions", then re-add the `push:`
# trigger below (or run this workflow manually) so it becomes the deployer.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Bake seo.* from the CMS into index.html <head>. Reads the public ?site=1
      # endpoint (no DB creds); best-effort, never fails the publish.
      - name: Bake SEO into <head>
        run: python3 scripts/bake_seo.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
