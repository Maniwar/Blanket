# Probes the browser-side (publishable) Supabase credentials for both sites.
# Publishable keys are public by design — they ship in the page source; RLS
# decides what they can touch. This exists because the agent sandbox cannot
# reach supabase.co, so browser-credential health is verified from CI.
#
# Oracle: GET /functions/v1/concierge?defaults=1 with the publishable key.
# A LIVE key passes the platform gateway and reaches our function, whose
# admin gate answers 403 {"error":"Administrators only."} — that exact pair
# proves key validity AND function liveness. A dead key is rejected at the
# gateway (401 Invalid JWT) and never reaches our code. (The REST root is no
# longer a valid oracle: it demands secret keys for schema introspection.)
name: key-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: blanket key + engine (kvkjxjdpqoqasiehdlcw)
        env:
          K: sb_publishable_cYJYNzOu5EJ1x3IOt2nTUw_TFbkVwoy
        run: |
          code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 20 \
            -H "apikey: $K" -H "Authorization: Bearer $K" \
            "https://kvkjxjdpqoqasiehdlcw.supabase.co/functions/v1/concierge?defaults=1")
          echo "edge HTTP $code"; head -c 200 /tmp/b; echo
          test "$code" = "403" && grep -q "Administrators only" /tmp/b
      - name: 996 key + engine (amexzypgvntohhntahuj)
        if: always()
        env:
          K: sb_publishable_zt3jU2wLqqoWBaUgajs1tw_a-Sxi1sk
        run: |
          code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 20 \
            -H "apikey: $K" -H "Authorization: Bearer $K" \
            "https://amexzypgvntohhntahuj.supabase.co/functions/v1/concierge?defaults=1")
          echo "edge HTTP $code"; head -c 200 /tmp/b; echo
          test "$code" = "403" && grep -q "Administrators only" /tmp/b
