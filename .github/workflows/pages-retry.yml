# GitHub Pages deployments occasionally fail with a transient
# "Deployment failed, try again later" from actions/deploy-pages.
# A re-run has fixed it every time, so do that automatically:
# when a "Deploy to GitHub Pages" run fails, re-run its failed jobs
# (up to two automatic retries per run).
name: Retry failed Pages deploy

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
          echo "Requested retry of run ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }} failed)."
