# GitHub Pages deployments occasionally fail with a transient
# "Deployment failed, try again later" from actions/deploy-pages.
# A re-run has fixed it every time, so do that automatically:
# when a "Deploy to GitHub Pages" run fails, re-run its failed jobs
# (up to two automatic retries per run).
#
# Re-running the job re-uploads the pages artifact, and deploy-pages
# refuses when several artifacts share the "github-pages" name — so the
# stale artifacts from earlier attempts are deleted first.
name: Retry failed Pages deploy

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Drop stale pages artifacts, then re-run failed jobs
        run: |
          RUN=${{ github.event.workflow_run.id }}
          API="${{ github.api_url }}/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer ${{ github.token }}"
          curl -sS -H "$AUTH" "$API/actions/runs/$RUN/artifacts?per_page=100" \
            | python3 -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name']=='github-pages']" \
            | while read -r ART; do
                echo "Deleting stale artifact $ART"
                curl -sS -X DELETE -H "$AUTH" "$API/actions/artifacts/$ART"
              done
          curl -sS -f -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$API/actions/runs/$RUN/rerun-failed-jobs"
          echo "Requested retry of run $RUN (attempt ${{ github.event.workflow_run.run_attempt }} failed)."
