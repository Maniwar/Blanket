name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-pages-deploy-14tf3y
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Bake seo.* from the CMS into index.html <head> so social crawlers (which
      # don't run the runtime hydrator's JS) see the current title/OG tags. Reads
      # the public ?site=1 endpoint (no DB creds); best-effort, never fails the
      # publish (bake_seo.py exits 0 on any error, leaving the HTML untouched).
      - name: Bake SEO into <head>
        run: python3 scripts/bake_seo.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
