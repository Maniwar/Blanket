# Read-only operations report: where the judge is blocking, what the beats
# are doing, and what keeps landing in the knowledge-gap ledger. Aggregates
# only — no visitor columns are ever selected. Dispatch on demand; the log IS
# the report. (The agent sandbox cannot reach the database; CI can.)
name: ops-report
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DB: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: actions by kind (14 days)
        run: |
          psql "$DB" -c "select action, count(*) n from public.concierge_actions
            where created_at > now() - interval '14 days' group by 1 order by 2 desc;"
      - name: beat outcomes by beat kind (14 days)
        if: always()
        run: |
          psql "$DB" -c "select coalesce(payload->>'kind', '?') beat, action, count(*) n
            from public.concierge_actions
            where created_at > now() - interval '14 days' and action like 'beat%'
            group by 1, 2 order by 1, 3 desc;"
      - name: judge vetoes — reasons (14 days, truncated)
        if: always()
        run: |
          psql "$DB" -c "select left(coalesce(payload->>'reason', result, 'unlabeled'), 110) reason, count(*) n
            from public.concierge_actions
            where created_at > now() - interval '30 days' and action = 'beat_veto'
            group by 1 order by 2 desc limit 15;"
      - name: one raw veto payload shape (keys only)
        if: always()
        run: |
          psql "$DB" -c "select coalesce(payload->>'kind','?') beat, left(coalesce(payload->>'line',''), 100) vetoed_line
            from public.concierge_actions where action = 'beat_veto'
            order by created_at desc limit 5;" || true
      - name: redraft learning (14 days) — accepted vs still blocked
        if: always()
        run: |
          psql "$DB" -c "select
              count(*) filter (where action = 'beat_action' and payload->>'redraft' = 'true') as redraft_accepted,
              count(*) filter (where action = 'beat_veto' and payload->>'redraft' = 'true') as redraft_still_blocked,
              count(*) filter (where action = 'beat_veto' and coalesce(payload->>'reason','') like 'pre-filter:%') as prefilter_kills
            from public.concierge_actions where created_at > now() - interval '14 days';"
      - name: knowledge gaps — repeats (30 days)
        if: always()
        run: |
          psql "$DB" -c "select left(question, 70) question, count(*) n, max(created_at)::date latest
            from public.concierge_flags
            where created_at > now() - interval '30 days'
            group by 1 having count(*) > 1 order by 2 desc limit 12;" || true
