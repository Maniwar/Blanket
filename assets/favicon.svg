<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Feierabend wax seal: pressed sealing wax, embossed initial. Reads at 16px. -->
  <defs>
    <radialGradient id="wax" cx="25" cy="22" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9B472"/>
      <stop offset=".5" stop-color="#C49B5B"/>
      <stop offset=".85" stop-color="#A67C3D"/>
      <stop offset="1" stop-color="#8A6229"/>
    </radialGradient>
  </defs>
  <!-- loden ground, like the site -->
  <rect width="64" height="64" rx="14" fill="#26332B"/>
  <!-- the blob: a pressed puddle with an uneven, squeezed-out edge -->
  <g fill="url(#wax)">
    <circle cx="32" cy="32" r="22"/>
    <ellipse cx="13" cy="30" rx="5.5" ry="4" transform="rotate(-18 13 30)"/>
    <ellipse cx="18" cy="45" rx="6" ry="4.5" transform="rotate(28 18 45)"/>
    <ellipse cx="35" cy="54" rx="7" ry="4" transform="rotate(-8 35 54)"/>
    <ellipse cx="50" cy="44" rx="5" ry="3.5" transform="rotate(40 50 44)"/>
    <ellipse cx="54" cy="30" rx="4" ry="5.5" transform="rotate(12 54 30)"/>
    <ellipse cx="47" cy="15" rx="6" ry="4.5" transform="rotate(-30 47 15)"/>
    <ellipse cx="28" cy="11" rx="7" ry="4" transform="rotate(6 28 11)"/>
    <ellipse cx="14" cy="19" rx="4.5" ry="3.5" transform="rotate(-42 14 19)"/>
  </g>
  <!-- die impression: sunken ring (light catches the lower lip) -->
  <circle cx="32" cy="33" r="16" fill="none" stroke="#EED9AC" stroke-opacity=".6" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#6E4E20" stroke-width="1.8"/>
  <!-- embossed initial: highlight below, shadow letter on top = pressed in -->
  <text x="32.7" y="41.7" text-anchor="middle" font-family="Gloock, Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#EED9AC" fill-opacity=".6">F</text>
  <text x="32" y="41" text-anchor="middle" font-family="Gloock, Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#5C3F17">F</text>
</svg>
