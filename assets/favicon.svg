<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Feierabend wax seal: pressed sealing wax, embossed initial. Reads at 16px. -->
  <defs>
    <radialGradient id="wax" cx="25" cy="22" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B0402C"/>
      <stop offset=".5" stop-color="#8E2F1E"/>
      <stop offset=".85" stop-color="#6E2113"/>
      <stop offset="1" stop-color="#571A0E"/>
    </radialGradient>
  </defs>
  <!-- the blob: a pressed puddle with an uneven, squeezed-out edge -->
  <g fill="url(#wax)">
    <circle cx="32" cy="32" r="25"/>
    <ellipse cx="11" cy="30" rx="6" ry="4.5" transform="rotate(-18 11 30)"/>
    <ellipse cx="17" cy="47" rx="7" ry="5" transform="rotate(28 17 47)"/>
    <ellipse cx="35" cy="57" rx="8" ry="4.5" transform="rotate(-8 35 57)"/>
    <ellipse cx="52" cy="46" rx="5.5" ry="4" transform="rotate(40 52 46)"/>
    <ellipse cx="57" cy="30" rx="4.5" ry="6" transform="rotate(12 57 30)"/>
    <ellipse cx="49" cy="13" rx="7" ry="5" transform="rotate(-30 49 13)"/>
    <ellipse cx="28" cy="8" rx="8" ry="4.5" transform="rotate(6 28 8)"/>
    <ellipse cx="12" cy="17" rx="5" ry="4" transform="rotate(-42 12 17)"/>
  </g>
  <!-- die impression: sunken ring (light catches the lower lip) -->
  <circle cx="32" cy="33" r="18.5" fill="none" stroke="#D08A6B" stroke-opacity=".5" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#4E1409" stroke-width="2"/>
  <!-- embossed initial: highlight below, shadow letter on top = pressed in -->
  <text x="32.8" y="42.8" text-anchor="middle" font-family="Gloock, Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#D08A6B" fill-opacity=".55">F</text>
  <text x="32" y="42" text-anchor="middle" font-family="Gloock, Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#45110B">F</text>
</svg>
