<line x1="720" y1="542" x2="1050" y2="542" stroke="#b5761b" stroke-width="2.2" fill="none" marker-end="url(#a_write)"/>
<text x="885.0" y="535" font-size="10.6" class="t mono" text-anchor="middle" >UPDATE orders SET colorway = Graphit</text>
<line x1="720" y1="584" x2="1050" y2="584" stroke="#b5761b" stroke-width="2.2" fill="none" marker-end="url(#a_write)"/>
<text x="885.0" y="577" font-size="10.6" class="t mono" text-anchor="middle" >INSERT concierge_actions  (logAction · audit row)</text>
<line x1="720" y1="626" x2="430" y2="626" stroke="#6b6455" stroke-width="2.2" fill="none" marker-end="url(#a_model)"/>
<text x="575.0" y="619" font-size="10.6" class="t mono" text-anchor="middle" >tool_result: “Changed Nº 14231 to Graphit.”</text>
<line x1="430" y1="668" x2="720" y2="668" stroke="#9a927f" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#a_ret)"/>
<text x="575.0" y="661" font-size="10.6" class="t" text-anchor="middle" >final words</text>
<line x1="720" y1="710" x2="130" y2="710" stroke="#9a927f" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#a_ret)"/>
<text x="280" y="703" font-size="10.6" class="t" text-anchor="middle" >streamed reply</text>
<text x="40" y="784" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >The same skeleton, two variations</text>
<rect x="40" y="796" width="568" height="66" rx="12" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="58" y="820" font-size="12.5" class="t" text-anchor="start" font-weight="700" >Read-only tools</text>
<text x="58" y="838" font-size="10.8" class="m" text-anchor="start" >get_my_orders · track_shipment · get_care_guide stop at the</text>
<text x="58" y="853" font-size="10.8" class="m" text-anchor="start" >SELECT (step 7) — the read IS the job: no UPDATE, no audit row.</text>
<rect x="632" y="796" width="568" height="66" rx="12" fill="#f3eef7" stroke="#cabbd8" stroke-width="1" />
<text x="650" y="820" font-size="12.5" class="t" text-anchor="start" font-weight="700" >The one ACTION tool</text>
<text x="650" y="838" font-size="10.4" class="m" text-anchor="start" >resend_confirmation adds a hop after the ownership check:</text>
<text x="650" y="852" font-size="10.4" class="m" text-anchor="start" >Concierge → Commission fn (?custresend=1, service-key) → email —</text>
<text x="650" y="866" font-size="10.4" class="m" text-anchor="start" >the only tool that reaches outside the concierge.</text>
<line x1="40" y1="876" x2="1200" y2="876" stroke="#ddd3c2" stroke-width="1"/>
<text x="40" y="898" font-size="10.6" class="m" text-anchor="start" >Source: TOOLS.md. Tools run only for a verified session and only on the caller’s own entries (ownershipFilter); every call is written to concierge_actions. SOPs (concierge_sops) govern HOW the bot behaves around each.</text>
</svg>
