<text x="40" y="48" font-size="24" class="t" text-anchor="start" font-weight="700" >How a concierge tool reads &amp; writes — one call, end to end</text>
<text x="40" y="72" font-size="13" class="m" text-anchor="start" >The model decides to call a tool; the concierge function executes it — every read and write labelled, both hard gates shown. Source: TOOLS.md.</text>
