<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="336" viewBox="0 0 1240 336" font-family="'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a7a5a"/></marker><style>.t{fill:#2a2620}.m{fill:#6b6455}.h{font-weight:700}.cap{letter-spacing:.06em;text-transform:uppercase}.mono{font-family:'IBM Plex Mono','Courier New',monospace}.warn{fill:#8a4b32}.ok{fill:#3f6b4f}.accent{fill:#245a7e}</style></defs><rect width="1240" height="336" fill="#f6f2ea"/>
<text x="40" y="46" font-size="22" class="t" text-anchor="start" font-weight="700" >Honest by construction — persuasion never changes what is true</text>
<text x="40" y="68" font-size="13" class="m" text-anchor="start" >The trust unlock: the method can shape WHEN and HOW true things are said, but three independent layers keep WHAT is said true.</text>
<rect x="40" y="88" width="1160" height="58" rx="12" fill="#efe7f3" stroke="#cdbfd6" stroke-width="1" />
<text x="58" y="110" font-size="12" class="t" text-anchor="start" font-weight="700" fill="#3f6b4f">May</text>
<text x="100" y="110" font-size="11.4" class="t" text-anchor="start" >time real scarcity · build desire with one true detail · acknowledge a competitor · season a line from the client book.</text>
<text x="58" y="132" font-size="12" class="warn" text-anchor="start" font-weight="700" >May never</text>
<text x="140" y="132" font-size="11.4" class="warn" text-anchor="start" >invent counts or urgency · discount · make a medical claim (hedged included) · disparage · recite the book.</text>
<rect x="40.0" y="162" width="386.6666666666667" height="150" rx="12" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<circle cx="70.0" cy="194" r="14" fill="#5f8f6f"/>
<text x="70.0" y="199" font-size="14" class="t" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<text x="94.0" y="192" font-size="13.5" class="t" text-anchor="start" font-weight="700" >The constitution</text>
<text x="94.0" y="209" font-size="10" class="m mono" text-anchor="start" >kb.ts HONESTY &amp; SCOPE</text>
<text x="60.0" y="236" font-size="10.6" class="m" text-anchor="start" >Binds every section: one product, no invented</text>
<text x="60.0" y="251" font-size="10.6" class="m" text-anchor="start" >facts, no discounts, no medical claims, fair</text>
<text x="60.0" y="266" font-size="10.6" class="m" text-anchor="start" >comparisons, never break character.</text>
<rect x="446.6666666666667" y="162" width="386.6666666666667" height="150" rx="12" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<circle cx="476.6666666666667" cy="194" r="14" fill="#5f8f6f"/>
<text x="476.6666666666667" y="199" font-size="14" class="t" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<text x="500.6666666666667" y="192" font-size="13.5" class="t" text-anchor="start" font-weight="700" >The reach-out judge</text>
<text x="500.6666666666667" y="209" font-size="10" class="m mono" text-anchor="start" >second, stricter read · fail-open</text>
<text x="466.6666666666667" y="236" font-size="10.6" class="m" text-anchor="start" >Reviews every unprompted line before the visitor</text>
<text x="466.6666666666667" y="251" font-size="10.6" class="m" text-anchor="start" >sees it — vetoes pressure, invented commerce,</text>
<text x="466.6666666666667" y="266" font-size="10.6" class="m" text-anchor="start" >scorekeeping, leaked plumbing.</text>
<rect x="853.3333333333334" y="162" width="386.6666666666667" height="150" rx="12" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<circle cx="883.3333333333334" cy="194" r="14" fill="#5f8f6f"/>
<text x="883.3333333333334" y="199" font-size="14" class="t" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<text x="907.3333333333334" y="192" font-size="13.5" class="t" text-anchor="start" font-weight="700" >The honesty lint</text>
<text x="907.3333333333334" y="209" font-size="10" class="m mono" text-anchor="start" >?lint=1 · advisory, at save time</text>
<text x="873.3333333333334" y="236" font-size="10.6" class="m" text-anchor="start" >Flags any saved edit to the method, examples, or</text>
<text x="873.3333333333334" y="251" font-size="10.6" class="m" text-anchor="start" >beat notes that conflicts with the constitution —</text>
<text x="873.3333333333334" y="266" font-size="10.6" class="m" text-anchor="start" >before it goes live.</text>
</svg>
