<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1500" viewBox="0 0 1240 1500" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a7a5a"/>
    </marker>
    <style>
      .t{fill:#2a2620}.m{fill:#6b6455}.w{fill:#f7f8f9}
      .h{font-weight:700}
      .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
      .mono{font-family:'Courier New',monospace}
    </style>
  </defs>

  <rect width="1240" height="1500" fill="#f6f2ea"/>
  <text x="40" y="46" class="t h" font-size="24">The test surface — four layers, and where each leaves evidence</text>
  <text x="40" y="70" class="m" font-size="13">What the concierge says (behavior deck) · whether the knobs are connected (conformance) · how it holds up live (personas) · and the always-on runtime gate (reach-out judge). Full prose: evals/README.md.</text>

  <!-- ========== 1. BEHAVIOR DECK ========== -->
  <text x="40" y="116" class="t h cap">1 · Behavior deck — what the concierge SAYS (deploy gauntlet · admin Evals tab · CLI)</text>

  <rect x="40" y="130" width="200" height="86" rx="10" fill="#eef4fb" stroke="#c3d6ea"/>
  <text x="55" y="153" class="t h" font-size="13">Scenario deck</text>
  <text x="55" y="171" class="m mono" font-size="10.5">evals/scenarios.mjs</text>
  <text x="55" y="185" class="m mono" font-size="10.5">or concierge_evals (DB)</text>
  <text x="55" y="202" class="m" font-size="10.5">16 scripted conversations</text>

  <line x1="240" y1="173" x2="288" y2="173" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="290" y="130" width="200" height="86" rx="10" fill="#fdf6ec" stroke="#e3cfa8"/>
  <text x="305" y="153" class="t h" font-size="13">Replayed live</text>
  <text x="305" y="171" class="m" font-size="10.5">POST chat / beat / opener turns</text>
  <text x="305" y="186" class="m mono" font-size="10.5">session_key qa-eval-*</text>
  <text x="305" y="202" class="m" font-size="10.5">(metrics-excluded)</text>

  <line x1="490" y1="173" x2="538" y2="173" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="540" y="130" width="200" height="86" rx="10" fill="#f0efe9" stroke="#cfc8b8"/>
  <text x="555" y="153" class="t h" font-size="13">Deployed concierge</text>
  <text x="555" y="171" class="m" font-size="10.5">real prompt, real config,</text>
  <text x="555" y="186" class="m" font-size="10.5">real model — production</text>
  <text x="555" y="202" class="m mono" font-size="10.5">SSE reply + status frames</text>

  <line x1="740" y1="173" x2="788" y2="173" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="790" y="130" width="200" height="86" rx="10" fill="#eef7ef" stroke="#bfd8c2"/>
  <text x="805" y="153" class="t h" font-size="13">Checks</text>
  <text x="805" y="171" class="m" font-size="10.5">deterministic first (includes /</text>
  <text x="805" y="186" class="m" font-size="10.5">excludes / maxQuestions / held)</text>
  <text x="805" y="202" class="m" font-size="10.5">binary LLM judge for fuzzy only</text>

  <line x1="990" y1="173" x2="1038" y2="173" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="1040" y="130" width="160" height="86" rx="10" fill="#f3eefb" stroke="#d3c6e8"/>
  <text x="1055" y="153" class="t h" font-size="13">Pass RATE</text>
  <text x="1055" y="171" class="m" font-size="10.5">over N reps —</text>
  <text x="1055" y="186" class="m" font-size="10.5">one green run proves</text>
  <text x="1055" y="202" class="m" font-size="10.5">nothing; the rate does</text>

  <text x="40" y="244" class="m" font-size="11.5">↳ evidence: the per-check pass-rate table in the <tspan class="h">Deploy Concierge job summary</tspan> (every deploy) · inline results in the <tspan class="h">admin Evals tab</tspan> · CLI exit code for CI gating</text>

  <!-- ========== 2. CONFIG CONFORMANCE ========== -->
  <text x="40" y="296" class="t h cap">2 · Config conformance — are the knobs CONNECTED (Actions → Config Conformance · weekly)</text>

  <rect x="40" y="310" width="200" height="86" rx="10" fill="#eef4fb" stroke="#c3d6ea"/>
  <text x="55" y="333" class="t h" font-size="13">The configured truth</text>
  <text x="55" y="351" class="m mono" font-size="10.5">GET ?config=1</text>
  <text x="55" y="366" class="m" font-size="10.5">exactly what the admin saved</text>
  <text x="55" y="381" class="m" font-size="10.5">(timings, caps, modes, dial)</text>

  <line x1="240" y1="353" x2="288" y2="353" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="290" y="310" width="200" height="86" rx="10" fill="#fdf6ec" stroke="#e3cfa8"/>
  <text x="305" y="333" class="t h" font-size="13">The real widget</text>
  <text x="305" y="351" class="m" font-size="10.5">production page, headless</text>
  <text x="305" y="366" class="m mono" font-size="10.5">session_key qa-conform-*</text>
  <text x="305" y="381" class="m" font-size="10.5">types, moves, waits like a reader</text>

  <line x1="490" y1="353" x2="538" y2="353" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="540" y="310" width="290" height="86" rx="10" fill="#f0efe9" stroke="#cfc8b8"/>
  <text x="555" y="333" class="t h" font-size="13">Two kinds of reading</text>
  <text x="555" y="351" class="m" font-size="10.5"><tspan class="h">effective</tspan> — status(): the values the widget computed</text>
  <text x="555" y="366" class="m" font-size="10.5"><tspan class="h">observed</tspan> — timings watched live: opener, ladder</text>
  <text x="555" y="381" class="m mono" font-size="10.5">arms (nudgeArmedWhy), closed-panel bubble</text>

  <line x1="830" y1="353" x2="878" y2="353" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="880" y="310" width="320" height="86" rx="10" fill="#eef7ef" stroke="#bfd8c2"/>
  <text x="895" y="333" class="t h" font-size="13">PASS/FAIL per parameter, method named</text>
  <text x="895" y="351" class="m" font-size="10.5">every row says HOW it was verified: observed live /</text>
  <text x="895" y="366" class="m" font-size="10.5">effective value / skipped-with-reason — a FAIL names the</text>
  <text x="895" y="381" class="m" font-size="10.5">configured value and what the widget actually ran</text>

  <text x="40" y="424" class="m" font-size="11.5">↳ evidence: the parameter table in the <tspan class="h">workflow job summary</tspan> + downloadable <tspan class="h">conformance-report.md artifact</tspan> · written to be pasted back for diagnosis</text>

  <!-- ========== 3. PERSONA EVALS ========== -->
  <text x="40" y="476" class="t h cap">3 · Persona evals — live back-and-forth (Actions → Persona Evals · weekly · advisory)</text>

  <rect x="40" y="490" width="200" height="86" rx="10" fill="#eef4fb" stroke="#c3d6ea"/>
  <text x="55" y="513" class="t h" font-size="13">Persona brief</text>
  <text x="55" y="531" class="m" font-size="10.5">hesitant comparer ·</text>
  <text x="55" y="546" class="m" font-size="10.5">hurried gift buyer ·</text>
  <text x="55" y="561" class="m" font-size="10.5">post-purchase browser</text>

  <line x1="240" y1="533" x2="288" y2="533" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="290" y="490" width="240" height="86" rx="10" fill="#fdf6ec" stroke="#e3cfa8"/>
  <text x="305" y="513" class="t h" font-size="13">A model PLAYS the shopper</text>
  <text x="305" y="531" class="m" font-size="10.5">improvises 4–5 real turns against the</text>
  <text x="305" y="546" class="m" font-size="10.5">deployed concierge — not a script</text>
  <text x="305" y="561" class="m mono" font-size="10.5">session_key qa-persona-*</text>

  <line x1="530" y1="533" x2="578" y2="533" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="580" y="490" width="290" height="86" rx="10" fill="#f0efe9" stroke="#cfc8b8"/>
  <text x="595" y="513" class="t h" font-size="13">The whole conversation graded</text>
  <text x="595" y="531" class="m" font-size="10.5">mechanical: question density, plumbing leaks, length</text>
  <text x="595" y="546" class="m" font-size="10.5">judged: discovery-before-pitch, no invented commerce,</text>
  <text x="595" y="561" class="m" font-size="10.5">boundary respect — binary, conversation-level</text>

  <line x1="870" y1="533" x2="918" y2="533" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="920" y="490" width="280" height="86" rx="10" fill="#f3eefb" stroke="#d3c6e8"/>
  <text x="935" y="513" class="t h" font-size="13">Advisory — leads, never a gate</text>
  <text x="935" y="531" class="m" font-size="10.5">two models improvising = red rows are leads to read;</text>
  <text x="935" y="546" class="m" font-size="10.5">a failing persona prints its FULL transcript inline</text>
  <text x="935" y="561" class="m" font-size="10.5">so the evidence and the failure travel together</text>

  <text x="40" y="604" class="m" font-size="11.5">↳ evidence: graded results + failing transcripts in the <tspan class="h">workflow job summary</tspan> — exit code always 0 (informs, never blocks)</text>

  <!-- ========== 4. RUNTIME REACH-OUT JUDGE ========== -->
  <text x="40" y="656" class="t h cap">4 · The runtime reach-out judge — always on, every proactive line, production</text>

  <rect x="40" y="670" width="220" height="90" rx="10" fill="#eef4fb" stroke="#c3d6ea"/>
  <text x="55" y="693" class="t h" font-size="13">A beat decides to speak</text>
  <text x="55" y="711" class="m" font-size="10.5">nudge / opener / closed-panel</text>
  <text x="55" y="726" class="m" font-size="10.5">bubble — typed decision via the</text>
  <text x="55" y="741" class="m mono" font-size="10.5">beat_line tool {speak, line}</text>

  <line x1="260" y1="715" x2="308" y2="715" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="310" y="670" width="270" height="90" rx="10" fill="#fdf6ec" stroke="#e3cfa8"/>
  <text x="325" y="693" class="t h" font-size="13">Second, stricter reading</text>
  <text x="325" y="711" class="m" font-size="10.5">vetoes ONLY clear defects: plumbing leaks, score-</text>
  <text x="325" y="726" class="m" font-size="10.5">keeping, invented commerce, pressure, broken output,</text>
  <text x="325" y="741" class="m" font-size="10.5">inventorying the shopper · <tspan class="h">fail-open</tspan> on any error</text>

  <line x1="580" y1="700" x2="648" y2="700" stroke="#4d7d59" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="590" y="692" class="m" font-size="10.5">pass</text>
  <line x1="580" y1="736" x2="648" y2="736" stroke="#a05a4a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="590" y="752" class="m" font-size="10.5">veto</text>

  <rect x="650" y="670" width="250" height="40" rx="10" fill="#eef7ef" stroke="#bfd8c2"/>
  <text x="665" y="688" class="t h" font-size="12">Line ships to the shopper</text>
  <text x="665" y="702" class="m mono" font-size="10.5">→ beat_action row (subject spent)</text>

  <rect x="650" y="720" width="250" height="40" rx="10" fill="#faeeec" stroke="#e0bdb4"/>
  <text x="665" y="738" class="t h" font-size="12">Silence — never shown</text>
  <text x="665" y="752" class="m mono" font-size="10.5">→ beat_veto row (killed line + reason)</text>

  <rect x="920" y="670" width="280" height="90" rx="10" fill="#f3eefb" stroke="#d3c6e8"/>
  <text x="935" y="693" class="t h" font-size="13">Actions tab scoreboard</text>
  <text x="935" y="711" class="m" font-size="10.5">spoke · held · vetoed (7 days, each count</text>
  <text x="935" y="726" class="m" font-size="10.5">filters the log) — a held beat also writes</text>
  <text x="935" y="741" class="m mono" font-size="10.5">beat_hold, so silence is never invisible</text>

  <line x1="900" y1="690" x2="918" y2="700" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="740" x2="918" y2="726" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="40" y="788" class="m" font-size="11.5">↳ evidence: permanent <tspan class="mono">concierge_actions</tspan> rows (beat_action / beat_hold / beat_veto, each carrying the ledger snapshot + rule trace) · the 7-day beat trend in every deploy summary</text>

  <!-- ========== AUDIT TRAIL ========== -->
  <text x="40" y="844" class="t h cap">The audit trail — where the evidence lives, suite by suite</text>

  <rect x="40" y="858" width="1160" height="330" rx="12" fill="#fbf9f4" stroke="#d8d0be"/>

  <text x="60" y="888" class="t h" font-size="12.5">Suite</text>
  <text x="330" y="888" class="t h" font-size="12.5">Auditable output</text>
  <text x="760" y="888" class="t h" font-size="12.5">Where to find it</text>
  <line x1="60" y1="898" x2="1180" y2="898" stroke="#d8d0be"/>

  <text x="60" y="922" class="t" font-size="12">Behavior deck</text>
  <text x="330" y="922" class="m" font-size="11.5">per-check pass-rate table (ok/FAIL, judge reasons cited)</text>
  <text x="760" y="922" class="m" font-size="11.5">Deploy Concierge run → Summary · admin Evals tab</text>

  <text x="60" y="950" class="t" font-size="12">Config conformance</text>
  <text x="330" y="950" class="m" font-size="11.5">parameter table with per-row verification method</text>
  <text x="760" y="950" class="m" font-size="11.5">Config Conformance run → Summary + artifact (.md)</text>

  <text x="60" y="978" class="t" font-size="12">Persona evals</text>
  <text x="330" y="978" class="m" font-size="11.5">graded criteria + full failing transcripts</text>
  <text x="760" y="978" class="m" font-size="11.5">Persona Evals run → Summary</text>

  <text x="60" y="1006" class="t" font-size="12">Reach-out judge</text>
  <text x="330" y="1006" class="m" font-size="11.5">beat_action / beat_hold / beat_veto rows, ledger + trace attached</text>
  <text x="760" y="1006" class="m" font-size="11.5">Admin → Actions (strip + filterable log) · DB</text>

  <text x="60" y="1034" class="t" font-size="12">Unit tests (beat brain)</text>
  <text x="330" y="1034" class="m" font-size="11.5">deno test over the pure Action Table — 17 provable rules</text>
  <text x="760" y="1034" class="m" font-size="11.5">Deploy Concierge run → "Unit-test the beat brain" step</text>

  <text x="60" y="1062" class="t" font-size="12">Live smoke</text>
  <text x="330" y="1062" class="m" font-size="11.5">HTTP verdicts against the four production endpoints</text>
  <text x="760" y="1062" class="m" font-size="11.5">Deploy Concierge run → "Live smoke" step (gates the deploy)</text>

  <text x="60" y="1090" class="t" font-size="12">Beat trend</text>
  <text x="330" y="1090" class="m" font-size="11.5">7-day hold rate + spoken-action mix, straight from the DB</text>
  <text x="760" y="1090" class="m" font-size="11.5">Deploy Concierge run → Summary (bottom)</text>

  <text x="60" y="1118" class="t" font-size="12">Live widget diagnostics</text>
  <text x="330" y="1118" class="m" font-size="11.5">status(): lastSkip, recentSkips, effective caps, arm arithmetic</text>
  <text x="760" y="1118" class="m" font-size="11.5">Browser console → FeierabendConcierge.status()</text>

  <line x1="60" y1="1136" x2="1180" y2="1136" stroke="#d8d0be"/>
  <text x="60" y="1162" class="m" font-size="11.5">All test traffic runs under <tspan class="mono">qa-*</tspan> session keys and is excluded from engagement metrics. Every table above is designed to be pasted back to the</text>
  <text x="60" y="1178" class="m" font-size="11.5">assistant verbatim for diagnosis — a FAIL always names the configured value and what production actually did.</text>

  <!-- ========== CADENCE ========== -->
  <text x="40" y="1234" class="t h cap">When each layer runs</text>
  <rect x="40" y="1248" width="1160" height="200" rx="12" fill="#fbf9f4" stroke="#d8d0be"/>
  <text x="60" y="1278" class="t" font-size="12"><tspan class="h">Every deploy</tspan> (Deploy Concierge, dispatched)</text>
  <text x="400" y="1278" class="m" font-size="11.5">unit tests → type-check → deploy → live smoke (gates) → behavior deck (advisory) → beat trend</text>
  <text x="60" y="1308" class="t" font-size="12"><tspan class="h">On demand + Mondays 06:17 UTC</tspan></text>
  <text x="400" y="1308" class="m" font-size="11.5">Config Conformance — run it after changing Engagement settings for proof they took effect</text>
  <text x="60" y="1338" class="t" font-size="12"><tspan class="h">On demand + Mondays 06:43 UTC</tspan></text>
  <text x="400" y="1338" class="m" font-size="11.5">Persona Evals — kept out of the deploy gauntlet so its chat turns don't burn the smoke/deck rate budget</text>
  <text x="60" y="1368" class="t" font-size="12"><tspan class="h">Every proactive line, always</tspan></text>
  <text x="400" y="1368" class="m" font-size="11.5">the reach-out judge (outreach.beatJudge, default on) — the only layer that acts in production, and it fails open</text>
  <text x="60" y="1398" class="t" font-size="12"><tspan class="h">From the admin panel, any time</tspan></text>
  <text x="400" y="1398" class="m" font-size="11.5">Evals tab runs the DB-backed deck against the live function; the judge runs server-side (?judge=1) so the key never reaches the browser</text>
  <text x="60" y="1428" class="m" font-size="11.5">Promotion path: the behavior deck is advisory at 1 rep in the gauntlet today; once the committed baseline proves it stable, it becomes a hard gate (EVAL_THRESHOLD).</text>
</svg>
