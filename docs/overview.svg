<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="380" viewBox="0 0 1240 380" font-family="'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a7a5a"/></marker><style>.t{fill:#2a2620}.m{fill:#6b6455}.h{font-weight:700}.cap{letter-spacing:.06em;text-transform:uppercase}.mono{font-family:'IBM Plex Mono','Courier New',monospace}.warn{fill:#8a4b32}.ok{fill:#3f6b4f}.accent{fill:#245a7e}</style></defs><rect width="1240" height="380" fill="#f6f2ea"/>
<text x="40" y="46" font-size="22" class="t" text-anchor="start" font-weight="700" >How it works — one attentive conversation, safely acting on the register</text>
<text x="40" y="68" font-size="13" class="m" text-anchor="start" >A signed-in patron talks to the concierge; it reads and acts on the register through Claude’s tool use; an operator shapes it live and evals prove it.</text>
<rect x="40" y="110" width="250" height="120" rx="12" fill="#eef3f8" stroke="#a9c0d8" stroke-width="1" />
<text x="58" y="136" font-size="13.5" class="t" text-anchor="start" font-weight="700" >Shopper / Patron</text>
<text x="58" y="156" font-size="10.4" class="m" text-anchor="start" >browser widget · streaming chat</text>
<text x="58" y="171" font-size="10.4" class="m" text-anchor="start" >anonymous browse · magic-link sign-in</text>
<text x="58" y="186" font-size="10.4" class="m" text-anchor="start" >remembered next time (client book)</text>
<rect x="360" y="110" width="300" height="120" rx="12" fill="#f3eef7" stroke="#cabbd8" stroke-width="1" />
<text x="378" y="136" font-size="13.5" class="t" text-anchor="start" font-weight="700" >Concierge · Claude</text>
<text x="378" y="156" font-size="10.4" class="m" text-anchor="start" >on-brand selling method + KB</text>
<text x="378" y="171" font-size="10.4" class="m" text-anchor="start" >native tool use (agentic loop)</text>
<text x="378" y="186" font-size="10.4" class="m" text-anchor="start" >honest by construction</text>
<rect x="730" y="70" width="470" height="88" rx="12" fill="#f6f1e7" stroke="#d9c9a6" stroke-width="1" />
<text x="748" y="96" font-size="13.5" class="t" text-anchor="start" font-weight="700" >Register · Postgres + RLS</text>
<text x="748" y="116" font-size="10.4" class="m" text-anchor="start" >reads orders · changes cloth · cancels</text>
<text x="748" y="131" font-size="10.4" class="m" text-anchor="start" >allocates numbered serials (collision-free)</text>
<text x="748" y="146" font-size="10.4" class="m" text-anchor="start" >every action ownership-scoped + audited</text>
<rect x="730" y="182" width="470" height="66" rx="12" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<text x="748" y="208" font-size="13.5" class="t" text-anchor="start" font-weight="700" >Leads · Inquiries (checkout-less)</text>
<text x="748" y="228" font-size="10.4" class="m" text-anchor="start" >offer · viewing · question · callback</text>
<text x="748" y="243" font-size="10.4" class="m" text-anchor="start" >stored + house emailed, honestly attributed</text>
<rect x="360" y="262" width="300" height="88" rx="12" fill="#f4efe6" stroke="#ddd0b8" stroke-width="1" />
<text x="378" y="288" font-size="13.5" class="t" text-anchor="start" font-weight="700" >Operator · Studio</text>
<text x="378" y="308" font-size="10.4" class="m" text-anchor="start" >tune voice · selling · tools · pacing</text>
<text x="378" y="323" font-size="10.4" class="m" text-anchor="start" >as DATA, live, no deploy — versioned</text>
<rect x="730" y="262" width="470" height="66" rx="12" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="748" y="288" font-size="13.5" class="t" text-anchor="start" font-weight="700" >Proof · Evals + Conformance</text>
<text x="748" y="308" font-size="10.4" class="m" text-anchor="start" >behavior deck · persona · config parity</text>
<text x="748" y="323" font-size="10.4" class="m" text-anchor="start" >CI-gated; a runtime judge guards outreach</text>
