<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="784" viewBox="0 0 1240 784" font-family="'Helvetica Neue',Arial,sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a7a5a"/></marker>
  <style>
    .t{fill:#2a2620}.m{fill:#6b6455}.h{font-weight:700}
    .cap{letter-spacing:.06em;text-transform:uppercase}
    .mono{font-family:'IBM Plex Mono','Courier New',monospace}
    .warn{fill:#8a4b32}
  </style>
</defs>
<rect width="1240" height="784" fill="#f6f2ea"/>
<text x="40" y="48" font-size="24" class="t" text-anchor="start" font-weight="700" >Inquiries — anonymous lead capture, end to end</text>
<text x="40" y="72" font-size="13" class="m" text-anchor="start" >On a considered-purchase page the most valuable non-purchase act is handing the house a lead. An inquiry stores it and emails the house — no account required.</text>
<text x="40" y="90" font-size="13" class="m" text-anchor="start" >Additive to in-chat forms and tools. Inserts arrive only through the edge function’s service role. Source: INQUIRIES.md.</text>
<text x="40" y="124" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >1 · Two ways in — one primitive</text>
<rect x="40" y="138" width="470" height="64" rx="12" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="58" y="162" font-size="12.5" class="t" text-anchor="start" font-weight="700" >Anonymous — an inquiry form</text>
<text x="58" y="181" font-size="10.6" class="m mono" text-anchor="start" >make-an-offer · book-a-viewing → POST ?form=1 → handleFormPost</text>
<text x="58" y="195" font-size="10.3" class="m" text-anchor="start" >routes the serial-free, sign-in-free path</text>
<rect x="40" y="214" width="470" height="64" rx="12" fill="#f4efe6" stroke="#ddd0b8" stroke-width="1" />
<text x="58" y="238" font-size="12.5" class="t" text-anchor="start" font-weight="700" >Signed-in — the model calls it</text>
<text x="58" y="257" font-size="10.6" class="m mono" text-anchor="start" >submit_inquiry runs in the agentic tool loop</text>
<text x="58" y="271" font-size="10.3" class="m" text-anchor="start" >e.g. an owner makes an offer in chat</text>
<rect x="690" y="168" width="280" height="80" rx="14" fill="#e6f0e8" stroke="#9fc9b0" stroke-width="1" />
<text x="830.0" y="198" font-size="14" class="t mono" text-anchor="middle" font-weight="700" >submit_inquiry</text>
<text x="830.0" y="218" font-size="10.6" class="m" text-anchor="middle" >anonymous-capable</text>
<text x="830.0" y="234" font-size="10" class="m" text-anchor="middle" >writes one row · notifies the house</text>
<path d="M510,170 C598.0,170 598.0,196 686,196" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<path d="M510,246 C598.0,246 598.0,220 686,220" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<text x="40" y="298" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >2 · The submit_inquiry pipeline</text>
<rect x="40.0" y="312" width="219.2" height="92" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="52.0" y="334" font-size="11.3" class="t" text-anchor="start" font-weight="700" >1. Validate</text>
<text x="52.0" y="354" font-size="9.6" class="m" text-anchor="start" >kind (one of four) + email</text>
<text x="52.0" y="367" font-size="9.6" class="m" text-anchor="start" >OR phone required</text>
<path d="M261.2,358 L273.2,358" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<rect x="275.2" y="312" width="219.2" height="92" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="287.2" y="334" font-size="11.3" class="t" text-anchor="start" font-weight="700" >2. Rate limit</text>
<text x="287.2" y="354" font-size="9.6" class="m" text-anchor="start" >≤ 5 per session_key /</text>
<text x="287.2" y="367" font-size="9.6" class="m" text-anchor="start" >rolling hour — over cap:</text>
<text x="287.2" y="380" font-size="9.6" class="m" text-anchor="start" >polite decline, no insert</text>
<path d="M496.4,358 L508.4,358" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<rect x="510.4" y="312" width="219.2" height="92" rx="10" fill="#f7edd8" stroke="#dcc38a" stroke-width="1" />
<text x="522.4" y="334" font-size="11.3" class="t" text-anchor="start" font-weight="700" >3. INSERT (service role)</text>
<text x="522.4" y="354" font-size="9.6" class="m" text-anchor="start" >RLS denies any direct anon</text>
<text x="522.4" y="367" font-size="9.6" class="m" text-anchor="start" >client write</text>
<path d="M731.5999999999999,358 L743.5999999999999,358" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<rect x="745.5999999999999" y="312" width="219.2" height="92" rx="10" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<text x="757.5999999999999" y="334" font-size="11.3" class="t" text-anchor="start" font-weight="700" >4. Notify the house</text>
<text x="757.5999999999999" y="354" font-size="9.6" class="m" text-anchor="start" >Resend →</text>
<text x="757.5999999999999" y="367" font-size="9.6" class="m" text-anchor="start" >inquiry_notify_email ·</text>
<text x="757.5999999999999" y="380" font-size="9.6" class="m" text-anchor="start" >fail-soft · logged to</text>
<text x="757.5999999999999" y="393" font-size="9.6" class="m" text-anchor="start" >email_log</text>
<path d="M966.8,358 L978.8,358" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<rect x="980.8" y="312" width="219.2" height="92" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="992.8" y="334" font-size="11.3" class="t" text-anchor="start" font-weight="700" >5. Confirm</text>
<text x="992.8" y="354" font-size="9.6" class="m" text-anchor="start" >a friendly line the</text>
<text x="992.8" y="367" font-size="9.6" class="m" text-anchor="start" >concierge relays back</text>
<text x="40" y="424" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >3 · The four kinds &amp; the attribution stamp</text>
<rect x="40" y="438" width="568" height="132" rx="12" fill="#f4efe6" stroke="#ddd0b8" stroke-width="1" />
<text x="60" y="464" font-size="13" class="t" text-anchor="start" font-weight="700" >The four kinds</text>
<rect x="60" y="471" width="88" height="22" rx="7" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="104" y="486" font-size="11" class="t mono" text-anchor="middle" font-weight="700" >offer</text>
<text x="158" y="486" font-size="10" class="m" text-anchor="start" >a real offer, with a figure when named</text>
<rect x="330" y="471" width="88" height="22" rx="7" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="374" y="486" font-size="11" class="t mono" text-anchor="middle" font-weight="700" >viewing</text>
<text x="428" y="486" font-size="10" class="m" text-anchor="start" >see the piece in person</text>
<rect x="60" y="501" width="88" height="22" rx="7" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="104" y="516" font-size="11" class="t mono" text-anchor="middle" font-weight="700" >question</text>
<text x="158" y="516" font-size="10" class="m" text-anchor="start" >only the owner can answer</text>
<rect x="330" y="501" width="88" height="22" rx="7" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="374" y="516" font-size="11" class="t mono" text-anchor="middle" font-weight="700" >callback</text>
<text x="428" y="516" font-size="10" class="m" text-anchor="start" >ask the owner to call back</text>
<text x="60" y="556" font-size="10.4" class="warn" text-anchor="start" >The price is firm — an inquiry opens a conversation with the owner, not a negotiation.</text>
<rect x="632" y="438" width="568" height="132" rx="12" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="652" y="464" font-size="13" class="t" text-anchor="start" font-weight="700" >Attribution stamp — concierge by construction</text>
<text x="652" y="484" font-size="10.6" class="m" text-anchor="start" >There is no non-chat path, so every inquiry is concierge-attributed.</text>
<text x="652" y="510" font-size="11" class="t mono" text-anchor="start" font-weight="700" >chat_via</text>
<text x="782" y="510" font-size="10.4" class="m" text-anchor="start" >always “concierge” (NULL or concierge)</text>
<text x="652" y="532" font-size="11" class="t mono" text-anchor="start" font-weight="700" >chat_meta</text>
<text x="782" y="532" font-size="10.4" class="m mono" text-anchor="start" >{ section, turns, origin (tool | form), captured_at }</text>
<text x="652" y="558" font-size="10" class="m" text-anchor="start" >Session context: injected on the tool path, or carried on the ?form=1 body for anon forms.</text>
<rect x="40" y="586" width="1160" height="66" rx="12" fill="#efe7f3" stroke="#cdbfd6" stroke-width="1" />
<text x="58" y="608" font-size="12" class="t" text-anchor="start" font-weight="700" >Reporting — a lead is not a sale (the inquiry-mode conversion event):</text>
<text x="58" y="627" font-size="10.8" class="m" text-anchor="start" >Count only, never a value — total + per-kind counts, no dollar ever attached, never added to revenue or the ✳ tiers.</text>
<text x="58" y="643" font-size="10.8" class="m" text-anchor="start" >Its own bucket — read from concierge_inquiries by created_at, never joined to orders · hidden where it doesn’t apply · same qa-/eval- exclusions.</text>
<rect x="40" y="672" width="1160" height="50" rx="12" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<text x="58" y="693" font-size="12" class="t" text-anchor="start" font-weight="700" >Trust &amp; audit:</text>
<text x="180" y="693" font-size="10.8" class="t" text-anchor="start" >no anon DB write (RLS denies it; only the service role inserts) · server-side re-validation of kind/contact/fields.</text>
<text x="58" y="711" font-size="10.8" class="m" text-anchor="start" >Rate-limited twice over — the shared per-IP form limiter plus the per-session 5/hour cap · fail-soft email: a notify failure never loses the lead (every attempt lands in email_log).</text>
<line x1="40" y1="742" x2="1200" y2="742" stroke="#ddd3c2" stroke-width="1"/>
<text x="40" y="764" font-size="10.6" class="m" text-anchor="start" >Source: INQUIRIES.md. Forms seed enabled=false (drafts-first). Config: inquiry_notify_email (→ EMAIL_FROM fallback); RESEND_API_KEY secret. Full attribution spec: ATTRIBUTION.md.</text>
</svg>
