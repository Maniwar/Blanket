<text x="40" y="48" font-size="24" class="t" text-anchor="start" font-weight="700" >NPS — the survey beat, the score math, and the closed loop</text>
<text x="40" y="72" font-size="13" class="m" text-anchor="start" >A chat-native Net Promoter survey that fires ONCE at a natural close, categorizes the reason (detractor-forward), and feeds each customer’s history back</text>
<text x="40" y="90" font-size="13" class="m" text-anchor="start" >into the concierge’s next move — through the SAME coach + judge machinery already in production. Foundation shipped &amp; tested; live wiring is the next PR (NPS.md §9).</text>
<text x="40" y="108" font-size="12.2" class="m" text-anchor="start" >Source: NPS.md · beats.ts (npsTriggerGate · npsScore · detractorThemes · renderCustomerNps — all unit-tested) · setup.sql (nps_responses · nps_categories · nps_metrics).</text>
<text x="40" y="140" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >1 · The survey trigger — a beat gate, pure and tested (npsTriggerGate)</text>
<rect x="40.0" y="156" width="195.2" height="66" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="137.6" y="178" font-size="11.5" class="t" text-anchor="middle" font-weight="700" >enabled?</text>
<text x="137.6" y="194" font-size="9" class="m mono" text-anchor="middle" >outreach.nps.enabled</text>
<rect x="281.2" y="156" width="195.2" height="66" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="378.79999999999995" y="178" font-size="11.5" class="t" text-anchor="middle" font-weight="700" >natural close?</text>
<text x="378.79999999999995" y="194" font-size="9" class="m" text-anchor="middle" >order placed · goal met ·</text>
<text x="378.79999999999995" y="207" font-size="9" class="m" text-anchor="middle" >wrap-up/leave · “that’s all”</text>
<path d="M238.2,189.0 L278.2,189.0" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<text x="258.2" y="181.0" font-size="8.8" class="m" text-anchor="middle" >yes</text>
<rect x="522.4" y="156" width="195.2" height="66" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="620.0" y="178" font-size="11.5" class="t" text-anchor="middle" font-weight="700" >not already asked?</text>
<text x="620.0" y="194" font-size="9" class="m" text-anchor="middle" >offer-once ledger,</text>
<text x="620.0" y="207" font-size="9" class="m" text-anchor="middle" >per session</text>
<path d="M479.4,189.0 L519.4,189.0" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<text x="499.4" y="181.0" font-size="8.8" class="m" text-anchor="middle" >yes</text>
<rect x="763.5999999999999" y="156" width="195.2" height="66" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="861.1999999999999" y="178" font-size="11.5" class="t" text-anchor="middle" font-weight="700" >long enough?</text>
<text x="861.1999999999999" y="194" font-size="9" class="m mono" text-anchor="middle" >duration ≥</text>
<text x="861.1999999999999" y="207" font-size="9" class="m mono" text-anchor="middle" >minDurationMs</text>
<path d="M720.5999999999999,189.0 L760.5999999999999,189.0" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<text x="740.5999999999999" y="181.0" font-size="8.8" class="m" text-anchor="middle" >yes</text>
<rect x="1004.8" y="156" width="195.2" height="66" rx="10" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="1102.3999999999999" y="178" font-size="11.5" class="t" text-anchor="middle" font-weight="700" >past cooldown?</text>
<text x="1102.3999999999999" y="194" font-size="9" class="m mono" text-anchor="middle" >now − last survey ≥</text>
<text x="1102.3999999999999" y="207" font-size="9" class="m mono" text-anchor="middle" >cooldownMs</text>
<path d="M961.8,189.0 L1001.8,189.0" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<text x="981.8" y="181.0" font-size="8.8" class="m" text-anchor="middle" >yes</text>
<text x="40" y="240" font-size="10" class="m" text-anchor="start" >any “no” ⇒ hold, with the blocking reason recorded (as auditable as a held beat) · all “yes” ⇒ ask — and the invitation line itself still passes the reach-out judge, so the ask is never pushy.</text>
<text x="40" y="262" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >2 · The chat-native flow</text>
<text x="636" y="262" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >3 · The calculation (npsScore — mirrored in SQL by nps_metrics)</text>
<rect x="40" y="278" width="568" height="168" rx="12" fill="#f4efe6" stroke="#ddd0b8" stroke-width="1" />
<text x="58" y="304" font-size="9.5" class="m mono" text-anchor="start" font-weight="700" >concierge</text>
<text x="140" y="304" font-size="9.8" class="t" text-anchor="start" >“Would you recommend us to a friend? 0–10.”  [0][1]…[10] pills</text>
<text x="58" y="332" font-size="9.5" class="m mono" text-anchor="start" font-weight="700" >visitor</text>
<text x="140" y="332" font-size="9.8" class="m" text-anchor="start" >taps  {{nps:8}}  →  submit_nps(score) opens the row</text>
<text x="58" y="360" font-size="9.5" class="m mono" text-anchor="start" font-weight="700" >concierge</text>
<text x="140" y="360" font-size="9.8" class="t" text-anchor="start" >“Thank you. What made you give that score?”</text>
<text x="58" y="388" font-size="9.5" class="m mono" text-anchor="start" font-weight="700" >visitor</text>
<text x="140" y="388" font-size="9.8" class="m" text-anchor="start" >“Booking a slot took three tries.”  → reason_text, categorized async</text>
<text x="58" y="416" font-size="9.5" class="m mono" text-anchor="start" font-weight="700" >concierge</text>
<text x="140" y="416" font-size="9.8" class="t" text-anchor="start" >“Noted, truly — thank you.”  (skip = a pill, or simply not answering)</text>
<rect x="636" y="278" width="564" height="168" rx="12" fill="#e9f1ea" stroke="#7fae90" stroke-width="1" />
<text x="652" y="302" font-size="10.6" class="t mono" text-anchor="start" font-weight="700" >segment: 9–10 PROMOTER · 7–8 PASSIVE · 0–6 DETRACTOR</text>
<text x="652" y="324" font-size="10.4" class="t mono" text-anchor="start" >NPS = %promoters − %detractors   (−100 … 100, passives dilute only)</text>
<text x="652" y="348" font-size="9.6" class="m mono" text-anchor="start" >[10,10,9,7,0]</text>
<text x="800" y="348" font-size="9.6" class="t mono" text-anchor="start" font-weight="700" >→ 40</text>
<text x="872" y="348" font-size="9.2" class="m" text-anchor="start" >3 promoters, 1 detractor over 5</text>
<text x="652" y="370" font-size="9.6" class="m mono" text-anchor="start" >[7,8,7]</text>
<text x="800" y="370" font-size="9.6" class="t mono" text-anchor="start" font-weight="700" >→ 0</text>
<text x="872" y="370" font-size="9.2" class="m" text-anchor="start" >all passives — there ARE responses</text>
<text x="652" y="392" font-size="9.6" class="m mono" text-anchor="start" >[]</text>
<text x="800" y="392" font-size="9.6" class="t mono" text-anchor="start" font-weight="700" >→ null</text>
<text x="872" y="392" font-size="9.2" class="m" text-anchor="start" >no responses is NOT a zero</text>
<text x="652" y="414" font-size="9.6" class="m mono" text-anchor="start" >[0,1,2]</text>
<text x="800" y="414" font-size="9.6" class="t mono" text-anchor="start" font-weight="700" >→ −100</text>
<text x="872" y="414" font-size="9.2" class="m" text-anchor="start" >all detractors</text>
<text x="40" y="474" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >4 · Detractor reasons — the actionable half (detractorThemes + nps_categories)</text>
<rect x="40" y="490" width="1160" height="86" rx="12" fill="#f6ece8" stroke="#c98a6f" stroke-width="1" />
<text x="58" y="514" font-size="10.4" class="t" text-anchor="start" >The reason is classified into an admin-managed, DETRACTOR-FORWARD vocabulary (LLM forced-tool call; human re-categorisation logged):</text>
