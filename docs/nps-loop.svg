<text x="40" y="890" font-size="10.4" class="m" text-anchor="start" >Foundation only — the REQUEST_NPS beat, submit_nps tool, scale pill, categorizer, and the NPS dashboard tab are the wiring PR (NPS.md §9). See COACH.md · JUDGE.md · docs/runtime-brains.svg.</text>
