<rect x="442.0" y="528" width="66.80000000000001" height="22" rx="11" fill="#fbf9f4" stroke="#b06a4a" stroke-width="1" />
<text x="475.4" y="543" font-size="9.4" class="t mono" text-anchor="middle" font-weight="700" >outcome</text>
<rect x="518.8" y="528" width="73.2" height="22" rx="11" fill="#fbf9f4" stroke="#b06a4a" stroke-width="1" />
<text x="555.4" y="543" font-size="9.4" class="t mono" text-anchor="middle" font-weight="700" >guidance</text>
<rect x="602.0" y="528" width="86.0" height="22" rx="11" fill="#fbf9f4" stroke="#cdbfa6" stroke-width="1" />
<text x="645.0" y="543" font-size="9.4" class="m mono" text-anchor="middle" >experience</text>
<rect x="698.0" y="528" width="66.80000000000001" height="22" rx="11" fill="#fbf9f4" stroke="#cdbfa6" stroke-width="1" />
<text x="731.4" y="543" font-size="9.4" class="m mono" text-anchor="middle" >product</text>
<rect x="774.8" y="528" width="60.400000000000006" height="22" rx="11" fill="#fbf9f4" stroke="#cdbfa6" stroke-width="1" />
<text x="805.0" y="543" font-size="9.4" class="m mono" text-anchor="middle" >praise</text>
<rect x="845.1999999999999" y="528" width="54.0" height="22" rx="11" fill="#fbf9f4" stroke="#cdbfa6" stroke-width="1" />
<text x="872.1999999999999" y="543" font-size="9.4" class="m mono" text-anchor="middle" >other</text>
<text x="58" y="566" font-size="9.6" class="m" text-anchor="start" >detractorThemes() tallies concerns behind SUB-PROMOTER scores only (detractors + passives) — a promoter’s mention never dilutes the concern count. Outlined chips = detractor_focus.</text>
<text x="40" y="604" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >5 · The closed loop — reuses the coach + judge, pointed at satisfaction</text>
<rect x="40.0" y="620" width="249.5" height="70" rx="11" fill="#f4efe6" stroke="#ddd0b8" stroke-width="1" />
<text x="164.75" y="644" font-size="10.6" class="t mono" text-anchor="middle" font-weight="700" >nps_responses</text>
<text x="164.75" y="662" font-size="9.2" class="m" text-anchor="middle" >score · reason ·</text>
<text x="164.75" y="675" font-size="9.2" class="m" text-anchor="middle" >categories per session</text>
<rect x="343.5" y="620" width="249.5" height="70" rx="11" fill="#f3ede1" stroke="#d8c69a" stroke-width="1" />
<text x="468.25" y="644" font-size="10.6" class="t mono" text-anchor="middle" font-weight="700" >renderCustomerNps()</text>
<text x="468.25" y="662" font-size="9.2" class="m" text-anchor="middle" >segment · trend · recurring</text>
<text x="468.25" y="675" font-size="9.2" class="m" text-anchor="middle" >concerns · a forward play</text>
