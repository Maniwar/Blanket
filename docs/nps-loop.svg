<text x="771.75" y="644" font-size="10.6" class="t" text-anchor="middle" font-weight="700" >SALES COACH brief</text>
<text x="771.75" y="662" font-size="9.2" class="m" text-anchor="middle" >private — shapes the next</text>
<text x="771.75" y="675" font-size="9.2" class="m" text-anchor="middle" >line; NEVER quotes a score</text>
<path d="M596.0,655.0 L644.0,655.0" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<rect x="950.5" y="620" width="249.5" height="70" rx="11" fill="#f6ece8" stroke="#c98a6f" stroke-width="1" />
<text x="1075.25" y="644" font-size="10.6" class="t" text-anchor="middle" font-weight="700" >REACH-OUT JUDGE</text>
<text x="1075.25" y="662" font-size="9.2" class="m" text-anchor="middle" >vetoes any scorekeeping</text>
<text x="1075.25" y="675" font-size="9.2" class="m" text-anchor="middle" >that slips through</text>
<path d="M899.5,655.0 L947.5,655.0" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<path d="M1075.25,690 C1075.25,724 164.75,724 164.75,692" stroke="#b08d3a" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<text x="620.0" y="706" font-size="9.2" class="m" text-anchor="middle" fill="#b08d3a">a better next conversation → the next rating: Detractor → Passive → Promoter movement, tracked</text>
<rect x="40" y="736" width="1160" height="32" rx="9" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<text x="58" y="756" font-size="10.2" class="t" text-anchor="start" >THE HONESTY GUARD: NPS surfaces to the COACH, never echoes at the CUSTOMER — the brief says “never quote a past score” AND the judge independently vetoes scorekeeping. Thin history ⇒ empty brief (no invented pattern).</text>
<text x="40" y="784" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >How we know it works — hard-gate unit tests (beats_test.ts, run on every deploy + kit CI)</text>
