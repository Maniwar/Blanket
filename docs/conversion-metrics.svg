<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1560" viewBox="0 0 1240 1560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a7a5a"/>
    </marker>
    <style>
      .t{fill:#2a2620}.m{fill:#6b6455}.w{fill:#f7f8f9}
      .h{font-weight:700}
      .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
      .mono{font-family:'Courier New',monospace}
    </style>
  </defs>

  <rect width="1240" height="1560" fill="#f6f2ea"/>
  <text x="40" y="46" class="t h" font-size="24">Conversion &amp; revenue attribution — how every number is made</text>
  <text x="40" y="70" class="m" font-size="13">The capture pipeline, the three attribution tiers, the behavioral funnel, and the exact metric formulas behind the admin's Conversion tab. Full prose: ATTRIBUTION.md.</text>

  <!-- ========== 1. CAPTURE PIPELINE ========== -->
  <text x="40" y="112" class="t h cap">1 · Capture — the journey leaves evidence</text>

  <rect x="40" y="124" width="215" height="96" rx="10" fill="#eef4fb" stroke="#c3d6ea"/>
  <text x="55" y="147" class="t h" font-size="13">Page visit</text>
  <text x="55" y="165" class="m" font-size="11">beacon → site_events</text>
  <text x="55" y="180" class="m mono" font-size="10.5">kind='visit'</text>
  <text x="55" y="196" class="m" font-size="10.5">random visit_key — no IP,</text>
  <text x="55" y="209" class="m" font-size="10.5">no email, no identity</text>

  <rect x="285" y="124" width="215" height="96" rx="10" fill="#eef4fb" stroke="#c3d6ea"/>
  <text x="300" y="147" class="t h" font-size="13">Chat opens / speaks</text>
  <text x="300" y="165" class="m" font-size="11">beacon → site_events</text>
  <text x="300" y="180" class="m mono" font-size="10.5">kind='chat_open'</text>
  <text x="300" y="196" class="m" font-size="10.5">per-tab session key (cx-skey)</text>
  <text x="300" y="209" class="m" font-size="10.5">= conversations.session_key</text>

  <rect x="530" y="124" width="215" height="96" rx="10" fill="#fdf0e0" stroke="#e6c391"/>
  <text x="545" y="147" class="t h" font-size="13">✳ Commission button</text>
  <text x="545" y="165" class="m" font-size="11">the concierge's own button</text>
  <text x="545" y="180" class="m" font-size="11">stamps a 2-hour marker:</text>
  <text x="545" y="196" class="m mono" font-size="10.5">{ts, entry, section, turns}</text>
  <text x="545" y="209" class="m" font-size="10.5">the strongest causal signal</text>

  <rect x="775" y="124" width="215" height="96" rx="10" fill="#eef4fb" stroke="#c3d6ea"/>
  <text x="790" y="147" class="t h" font-size="13">Register sheet opens</text>
  <text x="790" y="165" class="m" font-size="11">beacon → site_events</text>
  <text x="790" y="180" class="m mono" font-size="10.5">kind='checkout_open'</text>
  <text x="790" y="196" class="m mono" font-size="10.5">via='concierge'|'page'</text>

  <rect x="1020" y="124" width="180" height="96" rx="10" fill="#e9f2e6" stroke="#b9d2b0"/>
  <text x="1035" y="147" class="t h" font-size="13">Order placed</text>
  <text x="1035" y="165" class="m" font-size="11">checkout sends, server</text>
  <text x="1035" y="178" class="m" font-size="11">whitelists &amp; stamps:</text>
  <text x="1035" y="194" class="m mono" font-size="10.5">chat_session</text>
  <text x="1035" y="207" class="m mono" font-size="10.5">chat_via · chat_meta</text>

  <path d="M255 172 L283 172" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M500 172 L528 172" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M745 172 L773 172" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M990 172 L1018 172" stroke="#8a7a5a" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <text x="40" y="248" class="m" font-size="11.5" font-style="italic">The marker clears after each successful order (one order, one click) · the attribution stamp is a logged best-effort PATCH — a failure never blocks the sale, and never hides silently.</text>

  <!-- ========== 2. THE THREE TIERS ========== -->
  <text x="40" y="292" class="t h cap">2 · Classify — every kept commission lands in exactly one tier</text>

  <rect x="40" y="304" width="373" height="120" rx="10" fill="#fdf0e0" stroke="#C49B5B" stroke-width="1.5"/>
  <text x="56" y="329" class="t h" font-size="14">✳ Concierge-initiated</text>
  <text x="56" y="348" class="m mono" font-size="11">orders.chat_via = 'concierge'</text>
  <text x="56" y="367" class="m" font-size="11.5">Checkout was opened from the concierge's own</text>
  <text x="56" y="381" class="m" font-size="11.5">commission button. CAUSAL — the tier to optimize;</text>
  <text x="56" y="395" class="m" font-size="11.5">quote this alone when claiming the bot drove revenue.</text>
  <text x="56" y="413" class="m" font-size="10.5" font-style="italic">carries chat_meta {entry, section, turns} for What-converts</text>

  <rect x="433" y="304" width="373" height="120" rx="10" fill="#eef3e6" stroke="#7a915a" stroke-width="1.5"/>
  <text x="449" y="329" class="t h" font-size="14">Chat-assisted</text>
  <text x="449" y="348" class="m mono" font-size="11">chat_session set · chat_via ≠ 'concierge'</text>
  <text x="449" y="367" class="m" font-size="11.5">A conversation ran in the buying tab session, but</text>
  <text x="449" y="381" class="m" font-size="11.5">checkout came from a page button. CO-OCCURRENCE —</text>
  <text x="449" y="395" class="m" font-size="11.5">influence plausible, not proven.</text>
  <text x="449" y="413" class="m" font-size="10.5" font-style="italic">pre-tier orders with a chat link classify here</text>

  <rect x="826" y="304" width="374" height="120" rx="10" fill="#eceef0" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="842" y="329" class="t h" font-size="14">Unassisted</text>
  <text x="842" y="348" class="m mono" font-size="11">chat_session IS NULL</text>
  <text x="842" y="367" class="m" font-size="11.5">No conversation in the buying session. The baseline —</text>
  <text x="842" y="381" class="m" font-size="11.5">but remember: cross-day and cross-device journeys</text>
  <text x="842" y="395" class="m" font-size="11.5">land here too, so attributed figures are a FLOOR.</text>

  <!-- ========== 3. THE FUNNEL ========== -->
  <text x="40" y="470" class="t h cap">3 · The behavioral funnel — five stages, three units</text>
  <text x="40" y="488" class="m" font-size="11.5">Unique count per stage, per time bucket (trend chart) and per range (snapshot). Pass-through across a unit change is directional, not an exact per-person rate.</text>

  <g font-size="12">
    <rect x="40" y="502" width="1160" height="38" rx="6" fill="#ffffff" stroke="#d3cdbf"/>
    <rect x="52" y="512" width="12" height="12" rx="2" fill="#3F9FC4"/>
    <text x="72" y="522" class="t h">Visits</text>
    <text x="72" y="534" class="m" font-size="10.5">unique devices · site_events 'visit' · event time</text>

    <rect x="286" y="512" width="12" height="12" rx="2" fill="#5E9C57"/>
    <text x="306" y="522" class="t h">Chat opened</text>
    <text x="306" y="534" class="m" font-size="10.5">unique devices · 'chat_open' · event time</text>

    <rect x="520" y="512" width="12" height="12" rx="2" fill="#B56AA8"/>
    <text x="540" y="522" class="t h">Spoke to concierge</text>
    <text x="540" y="534" class="m" font-size="10.5">unique conversations with a user turn · message time</text>

    <rect x="800" y="512" width="12" height="12" rx="2" fill="#C06552"/>
    <text x="820" y="522" class="t h">Register opened</text>
    <text x="820" y="534" class="m" font-size="10.5">unique devices · 'checkout_open' · event time</text>

    <rect x="1040" y="512" width="12" height="12" rx="2" fill="#B08838"/>
    <text x="1060" y="522" class="t h">Commissions</text>
    <text x="1060" y="534" class="m" font-size="10.5">kept orders · order date</text>
  </g>
  <text x="40" y="560" class="m" font-size="11" font-style="italic">Palette validated (colorblind-safe, six-checks) against the admin surface · beacon stages count from 8 Jul 2026 — before that they render "not tracked yet", never a fake 0.</text>

  <!-- ========== 4. METRIC FORMULAS ========== -->
  <text x="40" y="606" class="t h cap">4 · The metrics — exact formula · date basis · window</text>

  <!-- row 1: commerce -->
  <g>
    <rect x="40" y="620" width="278" height="118" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
    <text x="56" y="644" class="t h" font-size="13.5">Revenue</text>
    <text x="56" y="664" class="m mono" font-size="11">kept commissions × unit_price</text>
    <text x="56" y="683" class="m" font-size="11">date basis: order date (placed_at)</text>
    <text x="56" y="698" class="m" font-size="11">excludes: cancelled orders</text>
    <text x="56" y="716" class="m" font-size="10.5" font-style="italic">unit_price: Edition &amp; access → Register</text>
    <text x="56" y="729" class="m" font-size="10.5" font-style="italic">price ($589 when unset)</text>

    <rect x="334" y="620" width="278" height="118" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
    <text x="350" y="644" class="t h" font-size="13.5">Commissions</text>
    <text x="350" y="664" class="m mono" font-size="11">count(status ≠ 'cancelled')</text>
    <text x="350" y="683" class="m" font-size="11">date basis: order date (placed_at)</text>
    <text x="350" y="702" class="m" font-size="10.5" font-style="italic">tile click → the register, pre-filtered</text>

    <rect x="628" y="620" width="278" height="118" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
    <text x="644" y="644" class="t h" font-size="13.5">Avg order value</text>
    <text x="644" y="664" class="m mono" font-size="11">revenue ÷ kept commissions</text>
    <text x="644" y="683" class="m" font-size="11">date basis: order date</text>
    <text x="644" y="701" class="m" font-size="10.5" font-style="italic">≡ register price in this demo (one</text>
    <text x="644" y="714" class="m" font-size="10.5" font-style="italic">blanket per order, one price) — flat until</text>
    <text x="644" y="727" class="m" font-size="10.5" font-style="italic">multi-item / variable pricing exists</text>

    <rect x="922" y="620" width="278" height="118" rx="10" fill="#fdf0e0" stroke="#C49B5B"/>
    <text x="938" y="644" class="t h" font-size="13.5">Conversion rate</text>
    <text x="938" y="664" class="m mono" font-size="11">(✳ + assisted) ÷ conversations</text>
    <text x="938" y="683" class="m" font-size="11">CROSS-BASIS: numerator by order date,</text>
    <text x="938" y="697" class="m" font-size="11">denominator by conversation start</text>
    <text x="938" y="715" class="m" font-size="10.5" font-style="italic">a chat late in the window converting after</text>
    <text x="938" y="728" class="m" font-size="10.5" font-style="italic">it undercounts slightly — noise at 30d+</text>
  </g>

  <!-- row 2: concierge -->
  <g>
    <rect x="40" y="754" width="278" height="108" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
    <text x="56" y="778" class="t h" font-size="13.5">✳ Concierge-initiated</text>
    <text x="56" y="798" class="m mono" font-size="11">count(chat_via='concierge',</text>
    <text x="56" y="812" class="m mono" font-size="11">      status≠'cancelled')</text>
    <text x="56" y="831" class="m" font-size="11">date basis: order date</text>
    <text x="56" y="849" class="m" font-size="10.5" font-style="italic">populates from the tier's ship date only</text>

    <rect x="334" y="754" width="278" height="108" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
    <text x="350" y="778" class="t h" font-size="13.5">Attributed revenue</text>
    <text x="350" y="798" class="m mono" font-size="11">(✳ + assisted) × unit_price</text>
    <text x="350" y="817" class="m" font-size="11">date basis: order date</text>
    <text x="350" y="835" class="m" font-size="10.5" font-style="italic">quote the ✳ share alone when claiming</text>
    <text x="350" y="848" class="m" font-size="10.5" font-style="italic">causation — adding both tiers overstates</text>

    <rect x="628" y="754" width="278" height="108" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
    <text x="644" y="778" class="t h" font-size="13.5">Conversations · 👍 rate</text>
    <text x="644" y="798" class="m mono" font-size="11">rows created in range · by created_at</text>
    <text x="644" y="817" class="m mono" font-size="11">👍 ÷ all rated replies · ALL-TIME</text>
    <text x="644" y="835" class="m" font-size="10.5" font-style="italic">feedback rows carry no timestamp — the</text>
    <text x="644" y="848" class="m" font-size="10.5" font-style="italic">rate cannot be range-scoped, and says so</text>

    <rect x="922" y="754" width="278" height="108" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
    <text x="938" y="778" class="t h" font-size="13.5">Deltas (every tile)</text>
    <text x="938" y="798" class="m mono" font-size="11">(current − prior) ÷ prior</text>
    <text x="938" y="817" class="m" font-size="11">prior = the equal-length window</text>
    <text x="938" y="831" class="m" font-size="11">immediately before the range</text>
    <text x="938" y="849" class="m" font-size="10.5" font-style="italic">all-time has no prior window → no delta</text>
  </g>

  <!-- ========== 5. WHICH CHAT GETS CREDIT + BUCKETS ========== -->
  <text x="40" y="908" class="t h cap">5 · Credit &amp; time</text>

  <rect x="40" y="920" width="573" height="96" rx="10" fill="#eceae4" stroke="#d3cdbf"/>
  <text x="56" y="944" class="t h" font-size="13">Which chat gets the credit</text>
  <text x="56" y="963" class="m" font-size="11.5">orders.chat_session names the buying session (text join to</text>
  <text x="56" y="977" class="m" font-size="11.5">conversations.session_key). Several rows can share the key — drill-ins open</text>
  <text x="56" y="991" class="m" font-size="11.5">the LATEST conversation begun BEFORE the order was placed:</text>
  <text x="56" y="1006" class="m" font-size="11.5">the chat that was live at checkout.</text>

  <rect x="628" y="920" width="572" height="96" rx="10" fill="#eceae4" stroke="#d3cdbf"/>
  <text x="644" y="944" class="t h" font-size="13">Buckets &amp; ranges</text>
  <text x="644" y="963" class="m" font-size="11.5">Range picker: 7 / 30 / 90 days / all time. Trend charts bucket the current</text>
  <text x="644" y="977" class="m" font-size="11.5">range only: daily ≤ 31 days · weekly ≤ 200 days · monthly beyond.</text>
  <text x="644" y="991" class="m" font-size="11.5">Funnel dedup: unique per bucket on the trend chart, unique per range on</text>
  <text x="644" y="1006" class="m" font-size="11.5">the snapshot — the two can legitimately differ.</text>

  <!-- ========== 6. WHERE IT SURFACES ========== -->
  <text x="40" y="1062" class="t h cap">6 · Where it surfaces — nothing is a dead end</text>

  <rect x="40" y="1074" width="1160" height="188" rx="10" fill="#ffffff" stroke="#d3cdbf"/>
  <g font-size="11.5" class="m">
    <text x="56" y="1100" class="t h" font-size="12.5">Conversion tab (the single metrics home)</text>
    <text x="56" y="1118">KPI rows with ⓘ definitions + deltas · funnel over time + snapshot · revenue &amp; rate trend charts (crosshair</text>
    <text x="56" y="1132">tooltip, keyboard-readable, table view) · attribution split · conversation stages · opportunities · what converts</text>

    <text x="56" y="1158" class="t h" font-size="12.5">Drill-ins</text>
    <text x="56" y="1176">tiles &amp; split legend → register pre-filtered by tier · rate tile → 🛒 commissioned chats · ✳ order rows → chat ↗ / order ↗ ·</text>
    <text x="56" y="1190">order drawer's attribution line → the driving conversation</text>

    <text x="56" y="1216" class="t h" font-size="12.5">Filters &amp; export</text>
    <text x="56" y="1234">register: tier chips beside status chips · Conversations: 🛒 commissioned-chats checkbox · Export CSV (Conversion tab + register)</text>
    <text x="56" y="1248">adds attribution, attr_entry, attr_section, attr_turns columns</text>
  </g>

  <!-- ========== 7. HONEST LIMITS ========== -->
  <text x="40" y="1308" class="t h cap">7 · Honest limits — read before quoting numbers</text>
  <rect x="40" y="1320" width="1160" height="150" rx="10" fill="#fbeeea" stroke="#dcae9f"/>
  <g font-size="11.5" class="m">
    <text x="56" y="1346">• Capture is same-tab-session: chat-today-buy-tomorrow or phone-chat-laptop-buy records as UNASSISTED — attributed figures are a floor, not a ceiling.</text>
    <text x="56" y="1368">• Chat-assisted is co-occurrence, not causation — that is exactly why the ✳ tier exists.</text>
    <text x="56" y="1390">• The judge's sales stages are model reads of transcripts, re-runnable and sampled — directional, never ledger entries. The ✳ tier is the hard signal.</text>
    <text x="56" y="1412">• Retention (~180 days) prunes conversations/events; order rows and tier stamps survive, so revenue reporting outlives the transcripts behind it.</text>
    <text x="56" y="1434">• Demo pricing: revenue is exactly count × configured price — no tax, discounts, refunds, or partials.</text>
    <text x="56" y="1456">• Funnel stages mix units (devices / conversations / orders) — stage-to-stage pass-through is directional, and each row states its unit.</text>
  </g>

  <!-- footer -->
  <text x="40" y="1502" class="m" font-size="12">Sources of truth: orders.chat_session / chat_via / chat_meta · site_events · concierge_conversations.sales_stage · concierge_config.unit_price</text>
  <text x="40" y="1522" class="m" font-size="12">Prose spec: ATTRIBUTION.md (events glossary · metric table · credit rules) · schema: supabase/SCHEMA.md · design rationale: DESIGN.md §4.8</text>
</svg>
