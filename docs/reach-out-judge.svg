<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1048" viewBox="0 0 1240 1048" font-family="'Helvetica Neue',Arial,sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a7a5a"/></marker>
  <style>
    .t{fill:#2a2620}.m{fill:#6b6455}.h{font-weight:700}
    .cap{letter-spacing:.06em;text-transform:uppercase}
    .mono{font-family:'IBM Plex Mono','Courier New',monospace}
    .warn{fill:#8a4b32}.ok{fill:#3f6b4f}
  </style>
</defs>
<rect width="1240" height="1048" fill="#f6f2ea"/>
<text x="40" y="48" font-size="24" class="t" text-anchor="start" font-weight="700" >The reach-out judge — how a proactive line is suppressed</text>
<text x="40" y="72" font-size="13" class="m" text-anchor="start" >An independent second model reviews every DRAFTED proactive line before the visitor sees it, and vetoes clear defects. Fail-open by design: a quality gate is never an availability risk.</text>
<text x="40" y="90" font-size="12.5" class="m" text-anchor="start" >Source: BEHAVIOR.md · supabase/functions/concierge/index.ts (judgeBeatLine ~2985–3057; call sites ~4511–4547 &amp; ~5394–5411).</text>
<text x="40" y="118" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >The pipeline — a spoken line must pass the judge to ship</text>
<rect x="300" y="132" width="640" height="54" rx="12" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="320" y="157" font-size="13.5" class="t" text-anchor="start" font-weight="700" >1 · Beat engine decides</text>
<text x="320" y="177" font-size="10.4" class="m" text-anchor="start" >the beat_line tool returns {speak, line} — a typed decision + free-text line</text>
<path d="M620.0,186 L620.0,200" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<rect x="300" y="200" width="640" height="60" rx="12" fill="#f4efe6" stroke="#ddd0b8" stroke-width="1" />
<text x="320" y="225" font-size="13.5" class="t" text-anchor="start" font-weight="700" >2 · Sanitize + hold-gate</text>
<text x="320" y="245" font-size="10.4" class="m" text-anchor="start" >stripPlumbing(line) · strip a trailing [HOLD] · a bare “hold” ⇒ not speaking</text>
<text x="320" y="260" font-size="10.4" class="m" text-anchor="start" >not speaking (or empty) ⇒ beat_hold audit row, stop — the judge is skipped</text>
<path d="M620.0,260 L620.0,274" stroke="#8a7a5a" stroke-width="1.9" fill="none" marker-end="url(#arr)"/>
<text x="630.0" y="270" font-size="9.5" class="m" text-anchor="start" >a SPOKEN line only</text>
<rect x="300" y="274" width="640" height="86" rx="14" fill="#e6f0e8" stroke="#7fae90" stroke-width="2" />
<text x="320" y="300" font-size="15" class="t" text-anchor="start" font-weight="700" fill="#2f6f4f">3 · REACH-OUT JUDGE</text>
<text x="320" y="319" font-size="10.6" class="m mono" text-anchor="start" >a second, stricter reading — judgeBeatLine(apiKey, line, kind, houseRules)</text>
<text x="320" y="336" font-size="10.2" class="m mono" text-anchor="start" >claude-haiku-4-5 · temperature 0 · max_tokens 150 · AbortSignal.timeout(4000)</text>
<text x="320" y="352" font-size="10.2" class="m mono" text-anchor="start" >forced tool_choice: verdict → { pass: boolean, reason: string (≤20 words) }</text>
<path d="M620.0,360 C620.0,376 233.33333333333334,370 233.33333333333334,392" stroke="#8a7a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<path d="M620.0,360 C620.0,376 640.0,370 640.0,392" stroke="#8a7a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<path d="M620.0,360 C620.0,376 1046.6666666666667,370 1046.6666666666667,392" stroke="#8a7a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="40" y="394" width="386.6666666666667" height="158" rx="12" fill="#e6f0e8" stroke="#5f8f6f" stroke-width="1" />
<rect x="40" y="394" width="386.6666666666667" height="26" rx="12" fill="#5f8f6f" />
<rect x="40" y="407" width="386.6666666666667" height="13" rx="0" fill="#5f8f6f" />
<text x="56" y="412" font-size="11.5" class=" mono" text-anchor="start" font-weight="700" fill="#ffffff">pass = true</text>
<text x="56" y="442" font-size="13" class="t" text-anchor="start" font-weight="700" >SPEAK — the line ships</text>
<text x="56" y="464" font-size="10.2" class="m" text-anchor="start" >the line is streamed to the visitor,</text>
<text x="56" y="479" font-size="10.2" class="m" text-anchor="start" >then logged as the assistant turn.</text>
<text x="56" y="494" font-size="10.2" class="m" text-anchor="start" ></text>
<text x="56" y="509" font-size="10.2" class="m" text-anchor="start" >The proactive reach-out reaches</text>
<text x="56" y="524" font-size="10.2" class="m" text-anchor="start" >the customer verbatim.</text>
<rect x="446.6666666666667" y="394" width="386.6666666666667" height="158" rx="12" fill="#f6ece8" stroke="#c98a6f" stroke-width="1" />
<rect x="446.6666666666667" y="394" width="386.6666666666667" height="26" rx="12" fill="#c98a6f" />
<rect x="446.6666666666667" y="407" width="386.6666666666667" height="13" rx="0" fill="#c98a6f" />
<text x="462.6666666666667" y="412" font-size="11.5" class=" mono" text-anchor="start" font-weight="700" fill="#ffffff">pass = false</text>
<text x="462.6666666666667" y="442" font-size="13" class="t" text-anchor="start" font-weight="700" >VETO — suppressed</text>
<text x="462.6666666666667" y="464" font-size="10.2" class="m" text-anchor="start" >send({hold:1}) — nothing is shown.</text>
<text x="462.6666666666667" y="479" font-size="10.2" class="m" text-anchor="start" >write a beat_veto audit row:</text>
<text x="462.6666666666667" y="494" font-size="10.2" class="m" text-anchor="start" >{ kind, line, reason, decision }.</text>
<text x="462.6666666666667" y="509" font-size="10.2" class="m" text-anchor="start" >The door stays OPEN — the action is</text>
<text x="462.6666666666667" y="524" font-size="10.2" class="m" text-anchor="start" >NOT marked spent, so the next beat</text>
<text x="462.6666666666667" y="539" font-size="10.2" class="m" text-anchor="start" >may retry it with a better line.</text>
<rect x="853.3333333333334" y="394" width="386.6666666666667" height="158" rx="12" fill="#eef4fb" stroke="#a9c0d8" stroke-width="1" />
<rect x="853.3333333333334" y="394" width="386.6666666666667" height="26" rx="12" fill="#a9c0d8" />
<rect x="853.3333333333334" y="407" width="386.6666666666667" height="13" rx="0" fill="#a9c0d8" />
<text x="869.3333333333334" y="412" font-size="11.5" class=" mono" text-anchor="start" font-weight="700" fill="#ffffff">error / &gt;4s</text>
<text x="869.3333333333334" y="442" font-size="13" class="t" text-anchor="start" font-weight="700" >FAIL-OPEN — the line ships</text>
<text x="869.3333333333334" y="464" font-size="10.2" class="m" text-anchor="start" >non-200, malformed verdict, timeout,</text>
<text x="869.3333333333334" y="479" font-size="10.2" class="m" text-anchor="start" >or any thrown error ⇒ veto=false.</text>
<text x="869.3333333333334" y="494" font-size="10.2" class="m" text-anchor="start" ></text>
<text x="869.3333333333334" y="509" font-size="10.2" class="m" text-anchor="start" >A judge outage costs quality review,</text>
<text x="869.3333333333334" y="524" font-size="10.2" class="m" text-anchor="start" >never availability. “When uncertain,</text>
<text x="869.3333333333334" y="539" font-size="10.2" class="m" text-anchor="start" >pass it.”</text>
<text x="40" y="576" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >The criterion — two parts: six UNIVERSAL defects (code) + the house’s own rules (injected per call)</text>
<rect x="40" y="590" width="1160" height="46" rx="9" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="58" y="609" font-size="10.6" class="t" text-anchor="start" font-weight="700" >GROUNDED PER HOUSE — houseHonestyRules(config) appends the effective constitution’s HONESTY &amp; SCOPE (voice_base else BRAND_SYSTEM) as authoritative</text>
<text x="58" y="625" font-size="10" class="m" text-anchor="start" >“house rules”: the judge reads THIS house’s price posture · claim boundaries · scope — never the selling dial. So a harder/softer sell can’t move the gate; only the house’s truth does.</text>
<rect x="40.0" y="650" width="590.0" height="56" rx="10" fill="#fbf9f4" stroke="#e2dccb" stroke-width="1" />
<rect x="40.0" y="650" width="5" height="56" rx="0" fill="#b06a4a" />
<text x="56.0" y="672" font-size="11.6" class="t" text-anchor="start" font-weight="700" >1 · Plumbing / meta leak</text>
<text x="56.0" y="688" font-size="9.7" class="m" text-anchor="start" >mentions prompts, rules, beats, tools, holding, being an AI — or</text>
<text x="56.0" y="701" font-size="9.7" class="m" text-anchor="start" >narrates its own outreach (“reach-out #2”)</text>
<rect x="650.0" y="650" width="590.0" height="56" rx="10" fill="#fbf9f4" stroke="#e2dccb" stroke-width="1" />
<rect x="650.0" y="650" width="5" height="56" rx="0" fill="#b06a4a" />
<text x="666.0" y="672" font-size="11.6" class="t" text-anchor="start" font-weight="700" >2 · Scorekeeping / guilt</text>
<text x="666.0" y="688" font-size="9.7" class="m" text-anchor="start" >counts its own messages, or points at the shopper’s silence (“I’ve</text>
<text x="666.0" y="701" font-size="9.7" class="m" text-anchor="start" >reached out twice”, “since you haven’t replied”)</text>
<rect x="40.0" y="714" width="590.0" height="56" rx="10" fill="#fbf9f4" stroke="#e2dccb" stroke-width="1" />
<rect x="40.0" y="714" width="5" height="56" rx="0" fill="#b06a4a" />
<text x="56.0" y="736" font-size="11.6" class="t" text-anchor="start" font-weight="700" >3 · Invented commerce</text>
<text x="56.0" y="752" font-size="9.7" class="m" text-anchor="start" >a discount, price cut, sale, or urgency the HOUSE RULES don’t authorize</text>
<text x="56.0" y="765" font-size="9.7" class="m" text-anchor="start" >(firm-price ⇒ discount vetoes; offers-allowed ⇒ inviting one is fine)</text>
<rect x="650.0" y="714" width="590.0" height="56" rx="10" fill="#fbf9f4" stroke="#e2dccb" stroke-width="1" />
<rect x="650.0" y="714" width="5" height="56" rx="0" fill="#b06a4a" />
<text x="666.0" y="736" font-size="11.6" class="t" text-anchor="start" font-weight="700" >4 · Pressure / desperation</text>
<text x="666.0" y="752" font-size="9.7" class="m" text-anchor="start" >begging, “last chance”, manufactured countdowns</text>
<rect x="40.0" y="778" width="590.0" height="56" rx="10" fill="#fbf9f4" stroke="#e2dccb" stroke-width="1" />
<rect x="40.0" y="778" width="5" height="56" rx="0" fill="#b06a4a" />
<text x="56.0" y="800" font-size="11.6" class="t" text-anchor="start" font-weight="700" >5 · Broken output</text>
<text x="56.0" y="816" font-size="9.7" class="m" text-anchor="start" >cut off mid-sentence, raw JSON or code, gibberish, visibly duplicated</text>
<text x="56.0" y="829" font-size="9.7" class="m" text-anchor="start" >text</text>
<rect x="650.0" y="778" width="590.0" height="56" rx="10" fill="#fbf9f4" stroke="#e2dccb" stroke-width="1" />
<rect x="650.0" y="778" width="5" height="56" rx="0" fill="#b06a4a" />
<text x="666.0" y="800" font-size="11.6" class="t" text-anchor="start" font-weight="700" >6 · Inventorying the shopper</text>
<text x="666.0" y="816" font-size="9.7" class="m" text-anchor="start" >reciting stored data back in aggregate (“five rooms across two cities”)</text>
<text x="666.0" y="829" font-size="9.7" class="m" text-anchor="start" >— a tally of their life reads as surveillance</text>
<rect x="40" y="844" width="1160" height="30" rx="9" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<text x="58" y="863" font-size="11" class="t" text-anchor="start" >LEGITIMATE (never vetoed): warmth · brevity · one light question · {{reply:…}} / {{action:…}} pills. The rule ends: “When uncertain, pass it.”</text>
<text x="40" y="894" font-size="12.5" class="t cap" text-anchor="start" font-weight="700" >Configuration · observability · cost</text>
<rect x="40.0" y="908" width="386.6666666666667" height="86" rx="12" fill="#eef4fb" stroke="#c3d6ea" stroke-width="1" />
<text x="56.0" y="932" font-size="12.5" class="t" text-anchor="start" font-weight="700" >Configuration</text>
<text x="56.0" y="952" font-size="9.6" class="m" text-anchor="start" >ONE live knob: outreach.beatJudge (Engagement →</text>
<text x="56.0" y="966" font-size="9.6" class="m" text-anchor="start" >House rules) — default ON (absent = on). Model ·</text>
<text x="56.0" y="980" font-size="9.6" class="m" text-anchor="start" >universal defects · thresholds are CODE; the house</text>
<text x="56.0" y="994" font-size="9.6" class="m" text-anchor="start" >rules are DERIVED from the constitution (not a knob).</text>
<rect x="446.6666666666667" y="908" width="386.6666666666667" height="86" rx="12" fill="#f4efe6" stroke="#ddd0b8" stroke-width="1" />
<text x="462.6666666666667" y="932" font-size="12.5" class="t" text-anchor="start" font-weight="700" >Observability</text>
<text x="462.6666666666667" y="952" font-size="9.6" class="m" text-anchor="start" >Actions tab scoreboard: spoke · held · vetoed (7-day).</text>
<text x="462.6666666666667" y="966" font-size="9.6" class="m" text-anchor="start" >Transcripts interleave vetoed lines, marked “the</text>
<text x="462.6666666666667" y="980" font-size="9.6" class="m" text-anchor="start" >visitor did NOT see this”, with the killed line + reason.</text>
<rect x="853.3333333333334" y="908" width="386.6666666666667" height="86" rx="12" fill="#e6f0e8" stroke="#bcd3c2" stroke-width="1" />
<text x="869.3333333333334" y="932" font-size="12.5" class="t" text-anchor="start" font-weight="700" >Cost</text>
<text x="869.3333333333334" y="952" font-size="9.6" class="m" text-anchor="start" >One ~600-token Haiku call per SPOKEN line — pennies</text>
<text x="869.3333333333334" y="966" font-size="9.6" class="m" text-anchor="start" >per hundred reach-outs. Held beats skip it entirely.</text>
<text x="869.3333333333334" y="980" font-size="9.6" class="m" text-anchor="start" >Verified by the verify-judge eval (evals/CATALOG.md).</text>
<line x1="40" y1="1008" x2="1200" y2="1008" stroke="#ddd3c2" stroke-width="1"/>
<text x="40" y="1028" font-size="10.5" class="m" text-anchor="start" >One of three independent honesty layers (with the constitution and the honesty lint). It is the only one that reads the model’s ACTUAL output at runtime, before the visitor sees it. See SALES.md §13 · BEHAVIOR.md · docs/beat-system.svg (stage 5).</text>
</svg>
